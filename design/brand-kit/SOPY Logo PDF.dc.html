<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=IBM+Plex+Sans+Arabic:wght@700&display=swap">
<style>body{margin:0}a{color:#1c3d2e}a:hover{color:#12271d}doc-page:not(:defined){visibility:hidden}</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page width="1080px" height="1080px">
  <section class="page" style="background:#1c3d2e;display:flex;align-items:center;justify-content:center;overflow:hidden">
    <dc-import name="SopyLogo" size="1200" layout="mark" theme="primary" hint-size="1200px,1200px"></dc-import>
  </section>
  <section class="page" style="background:#f4efe6;display:flex;align-items:center;justify-content:center">
    <dc-import name="SopyLogo" size="720" layout="mark" theme="primary" hint-size="720px,720px"></dc-import>
  </section>
  <section class="page" style="background:#ffffff;display:flex;align-items:center;justify-content:center">
    <dc-import name="SopyLogo" size="240" theme="primary" hint-size="706px,240px"></dc-import>
  </section>
  <section class="page" style="background:#1c3d2e;display:flex;align-items:center;justify-content:center">
    <dc-import name="SopyLogo" size="240" theme="reverse" hint-size="706px,240px"></dc-import>
  </section>
  <section class="page" style="background:#ffffff;display:flex;align-items:center;justify-content:center">
    <dc-import name="SopyLogo" size="200" script="arabic" theme="primary" hint-size="520px,200px"></dc-import>
  </section>
</doc-page>
</x-dc>
</body>
</html>
